spring.application.name=AuthAndProfiles

# Importa de forma nativa el archivo .env de la raíz como propiedades
spring.config.import=optional:file:.env[.properties]

# Configuración del servidor y base de datos apuntando al .env
server.port=${SERVER_PORT}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
# Crea los índices declarados con @Indexed (User.email, Profile.userId) al iniciar la app.
# Con la colección ya grande por las corridas de carga previas, esto puede tardar en el primer arranque;
# si prefieres no esperarlo, crea los índices una vez a mano en Atlas (ver README de load-tests) y
# puedes dejar esta propiedad en false.
spring.data.mongodb.auto-index-creation=true

# Configuración de JWT protegida
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# Redis (local con docker compose; en AWS, una EC2 con Docker y contraseña)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Configuración Resend Email
resend.api.key=${RESEND_API_KEY}
resend.email.from=${EMAIL_FROM}
# Interruptor para pruebas de carga: en false, no se llama a Resend (el sandbox rechaza correos a
# direcciones inventadas). El OTP se sigue generando y guardando en Redis igual.
app.email.enabled=${EMAIL_ENABLED:true}

# Pega aquí el Client ID que obtuviste en la consola de Google (termina en .apps.googleusercontent.com)
google.client.id=${GOOGLE_CLIENT_ID}

# GitHub OAuth (login social). El redirect-uri solo es obligatorio si la OAuth App tiene más de una callback URL.
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:}

# Amazon S3: fotos de perfil (bucket con lectura pública) y documentos de identidad (bucket PRIVADO)
aws.s3.region=${AWS_REGION:us-east-2}
aws.s3.photos-bucket=${S3_PHOTOS_BUCKET:taskit-profile-photos}
aws.s3.documents-bucket=${S3_DOCUMENTS_BUCKET:taskit-identity-documents}
# Vigencia del enlace prefirmado con el que el administrador abre un documento
aws.s3.presign-ttl-minutes=${SAS_TTL_MINUTES:10}
# SOLO desarrollo local (MinIO). En AWS déjalos vacíos: el SDK usa el rol IAM de la tarea
aws.s3.endpoint=${S3_ENDPOINT:}
aws.s3.access-key=${S3_ACCESS_KEY:}
aws.s3.secret-key=${S3_SECRET_KEY:}

# CORS (orígenes separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://taskit-frontend-ten.vercel.app}

# Administrador inicial (ya no está escrito en el código). Si ADMIN_PASSWORD está vacío no se crea.
admin.seed.email=${ADMIN_EMAIL:admin@omnitask.com}
admin.seed.password=${ADMIN_PASSWORD:}

# RabbitMQ (CloudAMQP en la nube; en local, docker compose up -d)
# RABBITMQ_URL es la URL AMQP completa del panel de CloudAMQP (amqps://usuario:clave@host/vhost). Con amqps se usa TLS (puerto 5671).
# NUNCA la escribas aquí: va solo en el .env o en las variables del servicio de ECS.
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672/}
app.rabbit.enabled=${RABBITMQ_ENABLED:true}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:2000}
# Confirmaciones del broker al publicar (el relay espera el ack antes de borrar el evento del outbox) y aviso de mensajes sin cola destino
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT_MS:10000}
# Los reintentos y el dead letter de los consumidores los define RabbitConfig; aquí no se activa el retry automático de Boot
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:10}

# Topología: un exchange topic compartido por todos los microservicios; la routing key es el nombre lógico del canal
# (taskit.auth.events, taskit.auth.audit, taskit.security.events, taskit.task.events). Cada MS tiene sus propias colas.
app.rabbit.exchange=${RABBITMQ_EXCHANGE:taskit.events}
app.rabbit.dead-letter-exchange=${RABBITMQ_DEAD_LETTER_EXCHANGE:taskit.dlx}
# Colas de este MS y routing key a la que se ligan
app.rabbit.security-queue=${RABBITMQ_SECURITY_QUEUE:auth-profile.security-events}
app.rabbit.security-routing-key=${RABBITMQ_SECURITY_ROUTING_KEY:taskit.security.events}
# Routing key con la que Task Service publica TaskCompleted (RF-AUTHPR-8)
app.rabbit.task-queue=${RABBITMQ_TASK_QUEUE:auth-profile.task-events}
app.rabbit.task-routing-key=${RABBITMQ_TASK_ROUTING_KEY:taskit.task.events}

# Reputación y moderación
app.reports.auto-suspend-threshold=${REPORTS_AUTO_SUSPEND_THRESHOLD:3}
# Sesiones por dispositivo (RF-AUTH-10/13): máximo de dispositivos con sesión activa; al superarlo se cierra la menos reciente
app.sessions.max-devices=${MAX_DEVICES_PER_ACCOUNT:3}

# Reintentos de Resend (RNF-AUTHPR-3): intentos totales y espera inicial (se duplica en cada intento)
app.email.max-attempts=${EMAIL_MAX_ATTEMPTS:3}
app.email.retry-backoff-ms=${EMAIL_RETRY_BACKOFF_MS:300}

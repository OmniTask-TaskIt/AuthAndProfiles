spring.application.name=AuthAndProfiles

# Importa de forma nativa el archivo .env de la raíz como propiedades
spring.config.import=optional:file:.env[.properties]

# Configuración del servidor y base de datos apuntando al .env
server.port=${SERVER_PORT}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
# Crea los índices declarados con @Indexed (User.email, Profile.userId) al iniciar la app.
# Con la colección ya grande por las corridas de carga previas, esto puede tardar en el primer arranque;
# si prefieres no esperarlo, crea los índices una vez a mano en Atlas (ver README de load-tests) y
# puedes dejar esta propiedad en false.
spring.data.mongodb.auto-index-creation=true

# Configuración de JWT protegida
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# Azure Cache for Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Configuración Resend Email
resend.api.key=${RESEND_API_KEY}
resend.email.from=${EMAIL_FROM}
# Interruptor para pruebas de carga: en false, no se llama a Resend (el sandbox rechaza correos a
# direcciones inventadas). El OTP se sigue generando y guardando en Redis igual.
app.email.enabled=${EMAIL_ENABLED:true}

# Pega aquí el Client ID que obtuviste en la consola de Google (termina en .apps.googleusercontent.com)
google.client.id=${GOOGLE_CLIENT_ID}

# GitHub OAuth (login social). El redirect-uri solo es obligatorio si la OAuth App tiene más de una callback URL.
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:}

# Azure Storage Blob
azure.storage.connection-string=${AZURE_BLOB}
azure.storage.container-name=${CONTAINER_BLOB}
# Contenedor PRIVADO para documentos de identidad (se crea solo si no existe) y vigencia del enlace temporal (SAS)
azure.storage.documents-container-name=${CONTAINER_DOCUMENTS_BLOB:identity-documents}
azure.storage.sas-ttl-minutes=${SAS_TTL_MINUTES:10}

# CORS (orígenes separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://taskit-frontend-omega.vercel.app}

# Administrador inicial (ya no está escrito en el código). Si ADMIN_PASSWORD está vacío no se crea.
admin.seed.email=${ADMIN_EMAIL:admin@omnitask.com}
admin.seed.password=${ADMIN_PASSWORD:}

# Kafka / Azure Event Hubs (protocolo Kafka)
# Local: docker compose up -d (PLAINTEXT en localhost:9092). Azure Event Hubs: ver docs/eventos-y-documentos.md
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.consumer-group=${KAFKA_CONSUMER_GROUP:auth-profile-service}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:2000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username="local" password="local";}
spring.kafka.consumer.group-id=${app.kafka.consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
# Event Hubs Standard no soporta productor idempotente; la entrega es "al menos una vez" y los consumidores deduplican por eventId
spring.kafka.producer.properties.enable.idempotence=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.delivery.timeout.ms=30000

# Reputación y moderación
app.reports.auto-suspend-threshold=${REPORTS_AUTO_SUSPEND_THRESHOLD:3}
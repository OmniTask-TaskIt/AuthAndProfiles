# Infraestructura local para desarrollo: RabbitMQ y Redis.
# Uso:  docker compose up -d      |      docker compose down
# Panel de RabbitMQ: http://localhost:15672 (guest / guest). En la nube se usa CloudAMQP (ver .env.example).
# MongoDB y Resend siguen siendo los servicios reales (Atlas / Resend). El almacenamiento se simula con S3Mock.
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taskit-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: taskit-redis
    ports:
      - "6379:6379"

  s3mock:
    image: adobe/s3mock:latest
    container_name: taskit-s3mock
    user: "0:0"
    environment:
      - debug=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=taskit-profile-photos,taskit-identity-documents
      - COM_ADOBE_TESTING_S3MOCK_STORE_REGION=us-east-2
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/store
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/store

volumes:
  s3mock-data: